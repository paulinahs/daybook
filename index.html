<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column. Wordmark and progress on top, three views (List, Calendar, Focus) behind a tab switch. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --fg: #141824;
  --muted: #5A6273;
  --line: #E0E4EC;
  --accent: #2A44E8;
  --on-accent: #FFFFFF;
  --accent-soft: #E6EAFF;
  --danger: #C23A2B;
  --danger-soft: #FCE8E5;
  --ok: #17805A;
  --ok-soft: #DDF3EA;
  --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1119;
    --surface: #161B26;
    --fg: #ECEFF6;
    --muted: #9AA3B6;
    --line: #283041;
    --accent: #8195FF;
    --on-accent: #0E1119;
    --accent-soft: #212A52;
    --danger: #FF8272;
    --danger-soft: #3A1E1E;
    --ok: #4CCB98;
    --ok-soft: #173A2E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1119;
  --surface: #161B26;
  --fg: #ECEFF6;
  --muted: #9AA3B6;
  --line: #283041;
  --accent: #8195FF;
  --on-accent: #0E1119;
  --accent-soft: #212A52;
  --danger: #FF8272;
  --danger-soft: #3A1E1E;
  --ok: #4CCB98;
  --ok-soft: #173A2E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  padding-block: 32px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.wrap { max-width: 46rem; margin: 0 auto; display: grid; gap: 20px; }
.view { display: grid; gap: 20px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
h1 { font: 700 2.5rem/1 var(--font-display); letter-spacing: -0.025em; margin: 0 0 6px; }
.today { margin: 0; color: var(--muted); }
.progress { flex: 1 1 14rem; max-width: 18rem; display: grid; gap: 6px; }
.pnum { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pnum b { color: var(--fg); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.overdue-note { font-size: 13px; color: var(--danger); font-weight: 600; min-height: 1.2em; }

/* tabs and segmented controls */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg .n { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 4px; }
.tabs { display: flex; }
.tabs .seg { width: 100%; }
.tabs .seg button { flex: 1 1 0; padding: 9px 12px; }

/* forms */
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.composer .title-fld { font-size: 18px; border: 0; background: transparent; padding: 6px 2px; width: 100%; min-width: 0; }
.composer .title-fld:focus-visible { outline-offset: 4px; border-radius: 4px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fld { height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.row .fld { flex: 1 1 8rem; }
.row select.fld { flex: 0 1 9.5rem; }
.row input[type="date"].fld { flex: 0 1 9.5rem; }
.row input[type="number"].fld { flex: 0 1 6.5rem; }
.spacer { flex: 1 1 0; }
.btn { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.composer .btn.primary { margin-left: auto; }

/* filters */
.filters { display: grid; gap: 10px; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { flex: 1 1 10rem; }
.sort { flex: 0 1 11rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 2px 11px; font-size: 13px; cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }

/* task list */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 10px 12px 14px; }
.task + .task { border-top: 1px solid var(--line); }
.check { width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; color: transparent; }
.check:hover { border-color: var(--accent); }
.task.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.main { min-width: 0; }
.title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.meta:empty { display: none; }
.chip { background: var(--accent-soft); color: var(--accent); padding: 0 8px; border-radius: 6px; font-weight: 500; }
.pri.hi { background: var(--danger-soft); color: var(--danger); padding: 0 8px; border-radius: 6px; font-weight: 600; }
.pri.lo { border: 1px solid var(--line); padding: 0 7px; border-radius: 6px; }
.tag-ex { border: 1px dashed var(--muted); padding: 0 7px; border-radius: 6px; }
.due, .sess { font-variant-numeric: tabular-nums; }
.due.over { color: var(--danger); font-weight: 600; }
.subchip { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 0 7px; font-size: 13px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.subchip:hover { border-color: var(--muted); }
.acts { display: flex; gap: 2px; }
.icon { min-width: 34px; height: 34px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; color: var(--muted); cursor: pointer; padding: 0 6px; font-size: 18px; line-height: 1; }
.icon:hover { background: var(--bg); color: var(--fg); }
.task.editing { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; }
.edit { display: grid; gap: 10px; }
.edit .title-fld { width: 100%; font-size: 16px; }

/* subtasks */
.subpanel { margin-top: 10px; display: grid; gap: 8px; }
.subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sub { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 30px; }
.subcheck { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; color: transparent; }
.sub.done .subcheck { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.stext { overflow-wrap: anywhere; font-size: 14px; }
.sub.done .stext { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.subx { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 6px; font-size: 16px; line-height: 1; }
.subx:hover { background: var(--bg); color: var(--danger); }
.subadd { display: flex; gap: 8px; }
.subadd .fld { flex: 1 1 auto; height: 34px; }
.subadd .btn { height: 34px; padding: 0 12px; }

.empty { text-align: center; padding: 36px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; display: grid; gap: 8px; justify-items: center; }
.empty p { margin: 0; max-width: 28rem; }
.empty-t { font: 600 1.15rem var(--font-display); }

/* calendar */
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cal-head h2 { font: 700 1.5rem var(--font-display); letter-spacing: -0.015em; margin: 0 auto 0 0; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.wd { background: var(--surface); padding: 6px 4px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.cell { background: var(--surface); border: 0; border-radius: 0; text-align: left; padding: 6px; min-height: 92px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; position: relative; min-width: 0; }
.cell:hover { background: var(--bg); }
.cell.other { background: var(--bg); color: var(--muted); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.dnum { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cell.today .dnum { background: var(--accent); color: var(--on-accent); }
.cchips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cchip { font-size: 12px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip.hi { background: var(--danger-soft); color: var(--danger); }
.cchip.done { background: var(--bg); color: var(--muted); text-decoration: line-through; }
.cmore { font-size: 12px; color: var(--muted); padding-left: 5px; }
.cdots { display: none; gap: 3px; flex-wrap: wrap; }
.cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cdot.over { background: var(--danger); }
.cdot.done { background: var(--ok); }
.csess { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums; }
.daypanel { display: grid; gap: 14px; }
.daypanel h3 { font: 700 1.25rem var(--font-display); margin: 0; letter-spacing: -0.01em; }
.dayadd { display: flex; flex-wrap: wrap; gap: 8px; }
.dayadd .fld { flex: 1 1 12rem; }
.dayempty { padding: 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

/* plan card and stepper */
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.plan-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.plan .bar i { background: var(--ok); }
.plan p { margin: 0; }
.step { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.step output { min-width: 5.5rem; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }

/* focus timer */
.tmcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px 22px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.phase { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tmcard.brk .phase { color: var(--ok); }
.ringwrap { position: relative; width: min(100%, 17rem); aspect-ratio: 1; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 9; }
.ring .trk { stroke: var(--line); }
.ring .prg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 553; stroke-dashoffset: 0; transition: stroke-dashoffset .25s linear; }
.tmcard.brk .ring .prg { stroke: var(--ok); }
.tmtime { position: absolute; inset: 0; display: grid; place-content: center; font: 700 3.6rem/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tmtime small { display: block; margin-top: 6px; font: 500 .85rem var(--font-body); letter-spacing: 0; color: var(--muted); }
.rounds { display: flex; gap: 8px; align-items: center; }
.rd { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--muted); }
.rd.on { background: var(--accent); border-color: var(--accent); }
.tmcard.brk .rd.on { background: var(--ok); border-color: var(--ok); }
.tmctl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tmctl .primary { min-width: 8rem; height: 44px; font-size: 16px; }
.tmtask { display: grid; gap: 6px; width: 100%; max-width: 26rem; text-align: left; }
.tmtask label { font-size: 13px; color: var(--muted); font-weight: 500; }
.tmtask .fld { width: 100%; }
.tmsubs { width: 100%; max-width: 26rem; text-align: left; }
.tmsubs h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card summary { cursor: pointer; font-weight: 600; }
.prefs { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 12px; margin-top: 12px; }
.prefs label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.prefs .fld { width: 100%; color: var(--fg); }
.prefs .auto { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; color: var(--fg); font-size: 14px; }

.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 20; }
.toast-btn { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

@media (max-width: 560px) {
  h1 { font-size: 2.1rem; }
  .composer .btn.primary { flex: 1 1 100%; margin-left: 0; }
  .row select.fld, .row input[type="date"].fld, .row input[type="number"].fld { flex: 1 1 7rem; }
  .task { grid-template-columns: 28px minmax(0, 1fr); }
  .acts { grid-column: 2; margin-left: -8px; }
  .cell { min-height: 58px; padding: 4px; align-items: center; }
  .cchips, .cmore { display: none; }
  .cdots { display: flex; justify-content: center; }
  .csess { top: 3px; right: 3px; }
  .tmtime { font-size: 3rem; }
}
@media (prefers-reduced-motion: reduce) { .bar i, .ring .prg { transition: none; } }
</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Daybook</h1>
      <p class="today" id="today"></p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="pnum"><span><b id="pdone">0</b> of <span id="ptotal">0</span> done</span><span id="ppct">0%</span></div>
      <div class="bar" role="presentation"><i id="pbar"></i></div>
      <div class="overdue-note" id="poverdue"></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Views">
    <div class="seg" role="group">
      <button type="button" data-view="list" aria-pressed="true">List</button>
      <button type="button" data-view="calendar" aria-pressed="false">Calendar</button>
      <button type="button" data-view="focus" aria-pressed="false">Focus<span class="n" id="tabTime"></span></button>
    </div>
  </nav>

  <div class="note" id="status" hidden></div>

  <!-- LIST -->
  <section class="view" id="viewList" aria-label="Task list">
    <form class="composer" id="add" autocomplete="off">
      <label class="sr" for="newTitle">New task</label>
      <input class="title-fld" id="newTitle" type="text" placeholder="What needs doing?" maxlength="200" required>
      <div class="row">
        <label class="sr" for="newCat">Category</label>
        <input class="fld" id="newCat" type="text" list="cats" placeholder="Category" maxlength="30">
        <label class="sr" for="newPri">Priority</label>
        <select class="fld" id="newPri">
          <option value="1">High priority</option>
          <option value="2" selected>Normal priority</option>
          <option value="3">Low priority</option>
        </select>
        <label class="sr" for="newDue">Due date</label>
        <input class="fld" id="newDue" type="date">
        <label class="sr" for="newEst">Estimated focus sessions</label>
        <input class="fld" id="newEst" type="number" min="0" max="40" placeholder="Sessions">
        <button class="btn primary" type="submit">Add task</button>
      </div>
    </form>
    <datalist id="cats"></datalist>

    <section class="filters" aria-label="Filters">
      <div class="bar-row">
        <div class="seg" role="group" aria-label="Show">
          <button type="button" data-status="open" aria-pressed="true">Open<span class="n" id="n-open"></span></button>
          <button type="button" data-status="done" aria-pressed="false">Done<span class="n" id="n-done"></span></button>
          <button type="button" data-status="all" aria-pressed="false">All<span class="n" id="n-all"></span></button>
        </div>
        <label class="sr" for="q">Search tasks</label>
        <input class="fld search" id="q" type="search" placeholder="Search tasks" autocomplete="off">
        <label class="sr" for="sort">Sort by</label>
        <select class="fld sort" id="sort">
          <option value="due">Sort: due date</option>
          <option value="pri">Sort: priority</option>
          <option value="new">Sort: newest</option>
        </select>
      </div>
      <div class="chips" id="catRow" role="group" aria-label="Category"></div>
    </section>

    <ul class="list" id="list" hidden></ul>
    <div class="empty" id="empty"><p class="empty-t">Loading your tasks…</p></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="viewCal" aria-label="Calendar" hidden>
    <div class="cal-head">
      <h2 id="calTitle"></h2>
      <button class="btn" type="button" id="calPrev" aria-label="Previous month">‹</button>
      <button class="btn" type="button" id="calToday">Today</button>
      <button class="btn" type="button" id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="calgrid" id="calGrid"></div>
    <div class="daypanel">
      <h3 id="dayHead"></h3>
      <div id="dayPlan"></div>
      <ul class="list" id="dayList"></ul>
      <div class="dayempty" id="dayEmpty" hidden>No tasks due on this day.</div>
      <form class="dayadd" id="dayAdd" autocomplete="off">
        <label class="sr" for="dayNew">Add a task for the selected day</label>
        <input class="fld" id="dayNew" type="text" placeholder="Add a task for this day" maxlength="200" required>
        <button class="btn primary" type="submit">Add</button>
      </form>
    </div>
  </section>

  <!-- FOCUS -->
  <section class="view" id="viewFocus" aria-label="Focus timer" hidden>
    <div class="tmcard" id="tmCard">
      <div class="phase" id="tmPhase">Focus</div>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="trk" cx="100" cy="100" r="88"></circle>
          <circle class="prg" id="tmRing" cx="100" cy="100" r="88"></circle>
        </svg>
        <div class="tmtime" role="timer" aria-live="off"><span id="tmTime">25:00</span><small id="tmSub"></small></div>
      </div>
      <div class="rounds" id="tmRounds" role="img" aria-label="Sessions in this cycle"></div>
      <div class="tmctl">
        <button class="btn primary" type="button" id="tmStart">Start</button>
        <button class="btn" type="button" id="tmReset">Reset</button>
        <button class="btn" type="button" id="tmSkip">Skip</button>
      </div>
      <div class="tmtask">
        <label for="tmTask">Working on</label>
        <select class="fld" id="tmTask"></select>
      </div>
      <div class="tmsubs" id="tmSubs"></div>
    </div>
    <div id="tmPlan"></div>
    <details class="card">
      <summary>Timer settings</summary>
      <div class="prefs">
        <label for="pfFocus">Focus (minutes)<input class="fld" id="pfFocus" type="number" min="1" max="120"></label>
        <label for="pfShort">Short break (minutes)<input class="fld" id="pfShort" type="number" min="1" max="60"></label>
        <label for="pfLong">Long break (minutes)<input class="fld" id="pfLong" type="number" min="1" max="90"></label>
        <label for="pfEvery">Long break after (sessions)<input class="fld" id="pfEvery" type="number" min="1" max="12"></label>
        <label for="pfGoal">Default daily sessions<input class="fld" id="pfGoal" type="number" min="0" max="16"></label>
        <label class="auto" for="pfAuto"><input id="pfAuto" type="checkbox"> Start the next phase automatically</label>
      </div>
    </details>
  </section>

  <div class="foot" id="foot"></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var LS_TASKS = 'daybook.tasks.v1', LS_DAYS = 'daybook.days.v1', LS_PREFS = 'daybook.prefs.v1', LS_TIMER = 'daybook.timer.v1';
  var VIEWS = ['list', 'calendar', 'focus'];
  var DEFAULT_PREFS = { focus: 25, short: 5, long: 15, every: 4, goal: 4, auto: false };
  var CIRC = 553;

  var now0 = new Date();
  var state = {
    tasks: [], loaded: false, daysLoaded: false, mode: 'pending',
    view: 'list', status: 'open', cat: '', q: '', sort: 'due',
    editing: null, draft: null, open: {},
    days: {}, prefs: Object.assign({}, DEFAULT_PREFS),
    cal: { y: now0.getFullYear(), m: now0.getMonth() }, sel: ''
  };
  var timer = { phase: 'focus', round: 1, status: 'idle', endsAt: 0, remaining: 0, taskId: '' };
  var persist = {
    save: function () { return Promise.resolve(); },
    remove: function () { return Promise.resolve(); },
    saveDay: function () { return Promise.resolve(); },
    savePrefs: function () { return Promise.resolve(); }
  };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return isoDate(new Date()); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dayDiff(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 864e5); }
  function offsetISO(n) { var d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clamp(n, lo, hi) { n = Number(n); if (!isFinite(n)) n = lo; return Math.min(hi, Math.max(lo, Math.round(n))); }
  function fmtDay(iso) { return parseISO(iso).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); }
  state.sel = todayISO();

  function norm(o, id) {
    var pri = Number(o.pri);
    return {
      id: id || o.id,
      title: String(o.title || '').slice(0, 200),
      cat: String(o.cat || '').slice(0, 30),
      pri: (pri === 1 || pri === 2 || pri === 3) ? pri : 2,
      due: /^\d{4}-\d{2}-\d{2}$/.test(o.due || '') ? o.due : '',
      done: !!o.done,
      created: Number(o.created) || 0,
      example: !!o.example,
      est: clamp(o.est || 0, 0, 40),
      spent: clamp(o.spent || 0, 0, 9999),
      subs: Array.isArray(o.subs) ? o.subs.filter(function (s) { return s && s.id; }).slice(0, 40).map(function (s) {
        return { id: String(s.id), text: String(s.text || '').slice(0, 120), done: !!s.done };
      }) : []
    };
  }
  function taskDoc(t) {
    return { title: t.title, cat: t.cat, pri: t.pri, due: t.due, done: t.done, created: t.created, example: t.example, est: t.est, spent: t.spent, subs: t.subs };
  }
  function normPrefs(o) {
    o = o || {};
    return {
      focus: clamp(o.focus || DEFAULT_PREFS.focus, 1, 120),
      short: clamp(o.short || DEFAULT_PREFS.short, 1, 60),
      long: clamp(o.long || DEFAULT_PREFS.long, 1, 90),
      every: clamp(o.every || DEFAULT_PREFS.every, 1, 12),
      goal: clamp(o.goal === undefined || o.goal === null ? DEFAULT_PREFS.goal : o.goal, 0, 16),
      auto: !!o.auto
    };
  }
  function normDay(v) {
    v = v || {};
    return { goal: typeof v.goal === 'number' ? clamp(v.goal, 0, 16) : null, sessions: clamp(v.sessions || 0, 0, 999), minutes: clamp(v.minutes || 0, 0, 99999) };
  }

  function h(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(c));
      });
    }
    return e;
  }

  var SVG_CHECK = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var SVG_CHECK_S = '<svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var ICON_ATTR = 'viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  var SVG_EDIT = '<svg ' + ICON_ATTR + '><path d="M12.5 4.5l3 3M4 16l.7-3.3L13.3 4.1a1.4 1.4 0 012 0l.6.6a1.4 1.4 0 010 2L7.3 15.3 4 16z"/></svg>';
  var SVG_DEL = '<svg ' + ICON_ATTR + '><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.6 9.5h6.8L14 6M8.5 9v4M11.5 9v4"/></svg>';
  var SVG_PLAY = '<svg ' + ICON_ATTR + '><path d="M7.5 5.5l7 4.5-7 4.5z"/></svg>';
  var SVG_SUBS = '<svg ' + ICON_ATTR + '><path d="M4 5h8M4 10h5M4 15h5M14 11v6M11 14h6"/></svg>';

  /* ---------- toast ---------- */
  var toastTimer;
  function hideToast() { $('toast').hidden = true; }
  function toast(msg, label, fn) {
    var el = $('toast');
    el.replaceChildren(h('span', { text: msg }));
    if (label) el.append(h('button', { type: 'button', class: 'toast-btn', text: label, onclick: function () { hideToast(); fn(); } }));
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 7000);
  }
  function fail() { toast('Could not save that change. Check your connection and try again.'); }

  /* ---------- task data ---------- */
  function find(id) { return state.tasks.find(function (x) { return x.id === id; }); }
  function commit(t) {
    var i = state.tasks.findIndex(function (x) { return x.id === t.id; });
    if (i >= 0) state.tasks[i] = t; else state.tasks.push(t);
    render();
    Promise.resolve(persist.save(t)).catch(fail);
  }
  function toggle(id) {
    var t = find(id);
    if (!t) return;
    commit(Object.assign({}, t, { done: !t.done }));
    var b = document.querySelector('[data-id="' + id + '"] .check');
    if (b) b.focus();
  }
  function del(id) {
    var t = find(id);
    if (!t) return;
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    if (state.editing === id) { state.editing = null; state.draft = null; }
    if (timer.taskId === id) { timer.taskId = ''; saveTimer(); }
    render();
    Promise.resolve(persist.remove(id)).catch(fail);
    var short = t.title.length > 40 ? t.title.slice(0, 40) + '…' : t.title;
    toast('Deleted “' + short + '”', 'Undo', function () { commit(t); });
  }
  function startEdit(t) {
    state.editing = t.id;
    state.draft = { title: t.title, cat: t.cat, pri: t.pri, due: t.due, est: t.est };
    render();
    var f = $('editTitle');
    if (f) f.focus();
  }
  function cancelEdit() {
    var id = state.editing;
    state.editing = null; state.draft = null;
    render();
    var b = document.querySelector('[data-id="' + id + '"] .icon');
    if (b) b.focus();
  }
  function saveEdit(id) {
    var t = find(id), d = state.draft;
    if (!t || !d) return;
    var title = d.title.trim();
    if (!title) { $('editTitle').focus(); return; }
    state.editing = null; state.draft = null;
    commit(norm(Object.assign({}, t, { title: title, cat: d.cat.trim(), pri: d.pri, due: d.due, est: d.est })));
  }

  /* subtasks */
  function focusSubInput(id) {
    var i = document.querySelector('.subpanel[data-for="' + id + '"] .subin');
    if (i) i.focus();
  }
  function addSub(id, text) {
    var t = find(id);
    if (!t || t.subs.length >= 40) return;
    state.open[id] = true;
    commit(Object.assign({}, t, { subs: t.subs.concat([{ id: newId(), text: text, done: false }]) }));
    focusSubInput(id);
  }
  function toggleSub(id, sid) {
    var t = find(id);
    if (!t) return;
    var subs = t.subs.map(function (s) { return s.id === sid ? { id: s.id, text: s.text, done: !s.done } : s; });
    var next = Object.assign({}, t, { subs: subs });
    commit(next);
    if (!t.done && subs.length && subs.every(function (s) { return s.done; })) {
      toast('All subtasks are done.', 'Mark task done', function () { toggle(id); });
    }
  }
  function delSub(id, sid) {
    var t = find(id);
    if (!t) return;
    commit(Object.assign({}, t, { subs: t.subs.filter(function (s) { return s.id !== sid; }) }));
    focusSubInput(id);
  }
  function subPanel(t) {
    var ul = h('ul', { class: 'subs' });
    t.subs.forEach(function (s) {
      var cb = h('button', {
        type: 'button', class: 'subcheck', role: 'checkbox', 'aria-checked': String(s.done),
        'aria-label': (s.done ? 'Mark as not done: ' : 'Mark as done: ') + s.text,
        onclick: function () { toggleSub(t.id, s.id); }
      });
      cb.innerHTML = SVG_CHECK_S;
      ul.append(h('li', { class: 'sub' + (s.done ? ' done' : '') }, cb, h('span', { class: 'stext', text: s.text }),
        h('button', { type: 'button', class: 'subx', 'aria-label': 'Delete subtask: ' + s.text, title: 'Delete subtask', text: '×', onclick: function () { delSub(t.id, s.id); } })));
    });
    var inp = h('input', { class: 'fld subin', type: 'text', placeholder: 'Add a subtask', maxlength: '120', 'aria-label': 'Add a subtask' });
    var form = h('form', {
      class: 'subadd', autocomplete: 'off',
      onsubmit: function (e) { e.preventDefault(); var v = inp.value.trim(); if (v) addSub(t.id, v); }
    }, inp, h('button', { class: 'btn', type: 'submit', text: 'Add' }));
    return h('div', { class: 'subpanel', 'data-for': t.id }, t.subs.length ? ul : null, form);
  }

  /* examples */
  function loadExamples() {
    var now = Date.now();
    [
      { title: 'Send the invoice to the client', cat: 'Work', pri: 1, due: offsetISO(0), est: 2 },
      { title: 'Reply to the landlord about the lease', cat: 'Home', pri: 1, due: offsetISO(-1), est: 1 },
      { title: 'Plan next week’s meals', cat: 'Home', pri: 2, due: offsetISO(1), est: 1 },
      { title: 'Prepare slides for Monday’s meeting', cat: 'Work', pri: 2, due: offsetISO(4), est: 4,
        subs: [{ id: 's1' + newId(), text: 'Outline the three key points', done: true }, { id: 's2' + newId(), text: 'Collect numbers from the report', done: false }, { id: 's3' + newId(), text: 'Draft the closing slide', done: false }] },
      { title: 'Renew the library card', cat: 'Personal', pri: 3, due: offsetISO(9) },
      { title: 'Back up phone photos', cat: 'Personal', pri: 2, due: '', done: true }
    ].forEach(function (o, i) {
      commit(norm(Object.assign({ created: now + i, example: true }, o), newId()));
    });
  }
  function removeExamples() {
    var ex = state.tasks.filter(function (t) { return t.example; });
    state.tasks = state.tasks.filter(function (t) { return !t.example; });
    render();
    ex.forEach(function (t) { Promise.resolve(persist.remove(t.id)).catch(fail); });
  }

  /* ---------- derived ---------- */
  function byOrder(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    var da = a.due || '9999-99-99', db = b.due || '9999-99-99';
    if (state.sort === 'new') return b.created - a.created;
    if (state.sort === 'pri') {
      if (a.pri !== b.pri) return a.pri - b.pri;
      if (da !== db) return da < db ? -1 : 1;
      return a.created - b.created;
    }
    if (da !== db) return da < db ? -1 : 1;
    if (a.pri !== b.pri) return a.pri - b.pri;
    return a.created - b.created;
  }
  function visible() {
    var q = state.q.trim().toLowerCase();
    return state.tasks.filter(function (t) {
      if (state.status === 'open' && t.done) return false;
      if (state.status === 'done' && !t.done) return false;
      if (state.cat && t.cat !== state.cat) return false;
      if (q && (t.title + ' ' + t.cat).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(byOrder);
  }
  function categories() {
    var seen = {};
    state.tasks.forEach(function (t) { if (t.cat) seen[t.cat] = true; });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b); });
  }
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function dueLabel(t) {
    var diff = dayDiff(t.due), d = parseISO(t.due);
    var short = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    if (t.done) return short;
    if (diff < -1) return (-diff) + ' days overdue';
    if (diff === -1) return 'Due yesterday';
    if (diff === 0) return 'Due today';
    if (diff === 1) return 'Due tomorrow';
    if (diff < 7) return 'Due ' + WEEKDAYS[d.getDay()];
    return 'Due ' + short;
  }
  function planGoal(date) {
    var d = state.days[date];
    return d && d.goal !== null && d.goal !== undefined ? d.goal : state.prefs.goal;
  }
  function setGoal(date, n) {
    if (!state.daysLoaded) { toast('Still loading your plan. Try again in a moment.'); return; }
    var d = Object.assign({ goal: null, sessions: 0, minutes: 0 }, state.days[date], { goal: clamp(n, 0, 16) });
    state.days[date] = d;
    render();
    Promise.resolve(persist.saveDay(date, d)).catch(fail);
  }

  /* ---------- task rows ---------- */
  function iconBtn(label, svg, fn) {
    var b = h('button', { type: 'button', class: 'icon', 'aria-label': label, title: label, onclick: fn });
    b.innerHTML = svg;
    return b;
  }
  function prioSelect(id, value, onchange) {
    return h('select', { id: id, class: 'fld', 'aria-label': 'Priority', onchange: onchange },
      h('option', { value: '1', selected: value === 1, text: 'High priority' }),
      h('option', { value: '2', selected: value === 2, text: 'Normal priority' }),
      h('option', { value: '3', selected: value === 3, text: 'Low priority' }));
  }
  function editRow(t) {
    var d = state.draft;
    var form = h('form', {
      class: 'edit',
      onsubmit: function (e) { e.preventDefault(); saveEdit(t.id); },
      onkeydown: function (e) { if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); } }
    },
      h('label', { class: 'sr', for: 'editTitle', text: 'Task title' }),
      h('input', { id: 'editTitle', class: 'fld title-fld', type: 'text', value: d.title, maxlength: '200', required: true, oninput: function (e) { d.title = e.target.value; } }),
      h('div', { class: 'row' },
        h('input', { id: 'editCat', class: 'fld', type: 'text', list: 'cats', placeholder: 'Category', 'aria-label': 'Category', value: d.cat, maxlength: '30', oninput: function (e) { d.cat = e.target.value; } }),
        prioSelect('editPri', d.pri, function (e) { d.pri = Number(e.target.value); }),
        h('input', { id: 'editDue', class: 'fld', type: 'date', 'aria-label': 'Due date', value: d.due, oninput: function (e) { d.due = e.target.value; } }),
        h('input', { id: 'editEst', class: 'fld', type: 'number', min: '0', max: '40', placeholder: 'Sessions', 'aria-label': 'Estimated focus sessions', value: d.est ? String(d.est) : '', oninput: function (e) { d.est = e.target.value; } }),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: cancelEdit }),
        h('button', { class: 'btn primary', type: 'submit', text: 'Save' })));
    return h('li', { class: 'task editing', 'data-id': t.id }, form);
  }
  function row(t) {
    if (state.editing === t.id && state.draft) return editRow(t);
    var over = !t.done && t.due && dayDiff(t.due) < 0;
    var subDone = t.subs.filter(function (s) { return s.done; }).length;
    var expanded = !!state.open[t.id];
    var check = h('button', {
      type: 'button', class: 'check', role: 'checkbox', 'aria-checked': String(t.done),
      'aria-label': (t.done ? 'Mark as not done: ' : 'Mark as done: ') + t.title,
      onclick: function () { toggle(t.id); }
    });
    check.innerHTML = SVG_CHECK;
    var sess = (t.est || t.spent) ? (t.spent + (t.est ? '/' + t.est : '') + (t.est || t.spent !== 1 ? ' sessions' : ' session')) : '';
    return h('li', { class: 'task' + (t.done ? ' done' : ''), 'data-id': t.id },
      check,
      h('div', { class: 'main' },
        h('div', { class: 'title', text: t.title }),
        h('div', { class: 'meta' },
          t.cat && h('span', { class: 'chip', text: t.cat }),
          t.pri === 1 && h('span', { class: 'pri hi', text: 'High' }),
          t.pri === 3 && h('span', { class: 'pri lo', text: 'Low' }),
          t.due && h('span', { class: 'due' + (over ? ' over' : ''), text: dueLabel(t) }),
          sess && h('span', { class: 'sess', text: sess }),
          t.subs.length > 0 && h('button', {
            type: 'button', class: 'subchip', 'aria-expanded': String(expanded),
            text: subDone + '/' + t.subs.length + ' subtasks',
            onclick: function () { state.open[t.id] = !state.open[t.id]; render(); }
          }),
          t.example && h('span', { class: 'tag-ex', text: 'Example' })),
        expanded && subPanel(t)),
      h('div', { class: 'acts' },
        !t.done && iconBtn('Focus on this task', SVG_PLAY, function () { timer.taskId = t.id; saveTimer(); setView('focus'); }),
        iconBtn(expanded ? 'Hide subtasks' : 'Subtasks', SVG_SUBS, function () {
          state.open[t.id] = !state.open[t.id]; render();
          if (state.open[t.id]) focusSubInput(t.id);
        }),
        iconBtn('Edit task', SVG_EDIT, function () { startEdit(t); }),
        iconBtn('Delete task', SVG_DEL, function () { del(t.id); })));
  }

  /* ---------- render: header, tabs, list ---------- */
  function renderHeader() {
    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    $('pdone').textContent = done;
    $('ptotal').textContent = total;
    $('ppct').textContent = pct + '%';
    $('pbar').style.width = pct + '%';
    var over = state.tasks.filter(function (t) { return !t.done && t.due && dayDiff(t.due) < 0; }).length;
    $('poverdue').textContent = over ? over + ' overdue' : '';
  }
  function renderTabs() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === state.view));
    });
  }
  function renderCats() {
    var dl = $('cats');
    dl.replaceChildren();
    categories().forEach(function (c) { dl.append(h('option', { value: c })); });
  }
  function renderFilters() {
    var open = state.tasks.filter(function (t) { return !t.done; }).length;
    $('n-open').textContent = open;
    $('n-done').textContent = state.tasks.length - open;
    $('n-all').textContent = state.tasks.length;
    document.querySelectorAll('.filters .seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-status') === state.status));
    });
    var cats = categories();
    if (state.cat && cats.indexOf(state.cat) < 0) state.cat = '';
    var rowEl = $('catRow');
    rowEl.replaceChildren();
    if (cats.length) {
      rowEl.append(h('button', { type: 'button', class: 'chipbtn', 'aria-pressed': String(!state.cat), text: 'All categories', onclick: function () { state.cat = ''; render(); } }));
      cats.forEach(function (c) {
        rowEl.append(h('button', { type: 'button', class: 'chipbtn', 'aria-pressed': String(state.cat === c), text: c, onclick: function () { state.cat = (state.cat === c ? '' : c); render(); } }));
      });
    }
  }
  function renderList() {
    var list = $('list'), empty = $('empty');
    list.replaceChildren();
    empty.replaceChildren();
    if (!state.loaded) {
      list.hidden = true; empty.hidden = false;
      empty.append(h('p', { class: 'empty-t', text: 'Loading your tasks…' }));
      return;
    }
    var vis = visible();
    if (!vis.length) {
      list.hidden = true; empty.hidden = false;
      if (!state.tasks.length) {
        empty.append(
          h('p', { class: 'empty-t', text: 'No tasks yet' }),
          h('p', { class: 'muted', text: 'Type a task above and press Enter. Add subtasks, a due date and a session estimate, then plan your days in the Calendar and Focus views.' }),
          h('button', { class: 'btn', type: 'button', text: 'Load example tasks', onclick: loadExamples }));
      } else {
        empty.append(
          h('p', { class: 'empty-t', text: state.status === 'open' && !state.q && !state.cat ? 'Everything is done' : 'Nothing matches these filters' }),
          h('button', { class: 'btn', type: 'button', text: 'Show all tasks', onclick: function () { state.status = 'all'; state.cat = ''; state.q = ''; $('q').value = ''; render(); } }));
      }
      return;
    }
    list.hidden = false; empty.hidden = true;
    vis.forEach(function (t) { list.append(row(t)); });
  }

  /* ---------- plan card ---------- */
  function planCard(date) {
    var d = state.days[date] || {};
    var goal = planGoal(date), done = d.sessions || 0, mins = d.minutes || 0;
    var pct = goal ? Math.min(100, Math.round(done / goal * 100)) : (done ? 100 : 0);
    var fill = h('i');
    fill.style.width = pct + '%';
    var isToday = date === todayISO();
    return h('div', { class: 'plan' },
      h('div', { class: 'plan-h' },
        h('strong', { text: isToday ? 'Today’s plan' : 'Plan for ' + parseISO(date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) }),
        h('div', { class: 'step', role: 'group', 'aria-label': 'Planned focus sessions' },
          h('button', { type: 'button', class: 'icon', 'aria-label': 'Plan one fewer session', text: '−', onclick: function () { setGoal(date, goal - 1); } }),
          h('output', { text: goal + (goal === 1 ? ' session' : ' sessions') }),
          h('button', { type: 'button', class: 'icon', 'aria-label': 'Plan one more session', text: '+', onclick: function () { setGoal(date, goal + 1); } }))),
      h('div', { class: 'bar', role: 'presentation' }, fill),
      h('p', { class: 'muted small', text: done + ' of ' + goal + ' sessions done, ' + mins + ' min focused' }));
  }

  /* ---------- calendar ---------- */
  function renderCal() {
    var y = state.cal.y, m = state.cal.m, today = todayISO();
    $('calTitle').textContent = new Date(y, m, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    var by = {};
    state.tasks.forEach(function (t) { if (t.due) (by[t.due] = by[t.due] || []).push(t); });
    Object.keys(by).forEach(function (k) { by[k].sort(byOrder); });
    var grid = $('calGrid');
    grid.replaceChildren();
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (w) { grid.append(h('div', { class: 'wd', text: w })); });
    var lead = (new Date(y, m, 1).getDay() + 6) % 7;
    var n = Math.ceil((lead + new Date(y, m + 1, 0).getDate()) / 7) * 7;
    for (var i = 0; i < n; i++) {
      (function (d) {
        var iso = isoDate(d), ts = by[iso] || [], dd = state.days[iso];
        var openCount = ts.filter(function (t) { return !t.done; }).length;
        var label = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + ts.length + (ts.length === 1 ? ' task' : ' tasks') + (dd && dd.sessions ? ', ' + dd.sessions + ' focus sessions' : '');
        var chips = h('div', { class: 'cchips' });
        ts.slice(0, 2).forEach(function (t) {
          chips.append(h('span', { class: 'cchip' + (t.done ? ' done' : (t.pri === 1 ? ' hi' : '')), text: t.title }));
        });
        var dots = h('div', { class: 'cdots' });
        ts.slice(0, 4).forEach(function (t) {
          dots.append(h('i', { class: 'cdot' + (t.done ? ' done' : (iso < today ? ' over' : '')) }));
        });
        grid.append(h('button', {
          type: 'button',
          class: 'cell' + (d.getMonth() !== m ? ' other' : '') + (iso === today ? ' today' : '') + (iso === state.sel ? ' sel' : ''),
          'aria-pressed': String(iso === state.sel), 'aria-label': label,
          onclick: function () {
            state.sel = iso;
            if (d.getMonth() !== m) state.cal = { y: d.getFullYear(), m: d.getMonth() };
            renderCal();
          }
        }, h('span', { class: 'dnum', text: d.getDate() }), chips, ts.length > 2 && h('span', { class: 'cmore', text: '+' + (ts.length - 2) + ' more' }), dots,
          dd && dd.sessions ? h('span', { class: 'csess', text: dd.sessions, title: dd.sessions + ' focus sessions' }) : null));
        void openCount;
      })(new Date(y, m, 1 - lead + i));
    }
    $('dayHead').textContent = fmtDay(state.sel);
    $('dayPlan').replaceChildren(planCard(state.sel));
    var ul = $('dayList');
    ul.replaceChildren();
    var dayTasks = (by[state.sel] || []);
    dayTasks.forEach(function (t) { ul.append(row(t)); });
    ul.hidden = !dayTasks.length;
    $('dayEmpty').hidden = dayTasks.length > 0;
  }

  /* ---------- timer ---------- */
  function phaseMs(p) { var s = state.prefs; return (p === 'focus' ? s.focus : p === 'short' ? s.short : s.long) * 60000; }
  function saveTimer() { try { localStorage.setItem(LS_TIMER, JSON.stringify(timer)); } catch (e) {} }
  function loadTimer() {
    try {
      var o = JSON.parse(localStorage.getItem(LS_TIMER) || 'null');
      if (o && (o.phase === 'focus' || o.phase === 'short' || o.phase === 'long')) {
        timer.phase = o.phase;
        timer.round = clamp(o.round || 1, 1, 12);
        timer.status = (o.status === 'running' || o.status === 'paused') ? o.status : 'idle';
        timer.endsAt = Number(o.endsAt) || 0;
        timer.remaining = Number(o.remaining) || 0;
        timer.taskId = String(o.taskId || '');
      }
    } catch (e) {}
    if (timer.status === 'idle' || !timer.remaining) timer.remaining = phaseMs(timer.phase);
  }
  function applyPrefs() {
    if (timer.status === 'idle') timer.remaining = phaseMs(timer.phase);
    if (timer.round > state.prefs.every) timer.round = state.prefs.every;
  }
  function curRemaining() {
    if (timer.status === 'running') return Math.max(0, timer.endsAt - Date.now());
    return timer.status === 'paused' ? timer.remaining : phaseMs(timer.phase);
  }
  var actx = null;
  function ensureAudio() {
    try {
      if (!actx) { var C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep() {
    try {
      if (!actx) return;
      [0, 0.3, 0.6].forEach(function (dt) {
        var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + dt;
        o.type = 'sine'; o.frequency.value = 880;
        o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
        o.start(t0); o.stop(t0 + 0.26);
      });
    } catch (e) {}
  }
  var wake = null;
  function wakeOn() {
    try {
      if (navigator.wakeLock && !wake && !document.hidden) {
        navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () {});
      }
    } catch (e) {}
  }
  function wakeOff() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }

  function timerStart() {
    ensureAudio();
    if (timer.status === 'running') return;
    var rem = timer.status === 'paused' ? timer.remaining : phaseMs(timer.phase);
    timer.endsAt = Date.now() + rem;
    timer.status = 'running';
    saveTimer(); wakeOn(); renderFocus(); renderTabTime();
  }
  function timerPause() {
    if (timer.status !== 'running') return;
    timer.remaining = Math.max(0, timer.endsAt - Date.now());
    timer.status = 'paused';
    saveTimer(); wakeOff(); renderFocus(); renderTabTime();
  }
  function timerReset() {
    timer.status = 'idle'; timer.remaining = phaseMs(timer.phase);
    saveTimer(); wakeOff(); renderFocus(); renderTabTime();
  }
  function recordSession() {
    var today = todayISO();
    var d = Object.assign({ goal: null, sessions: 0, minutes: 0 }, state.days[today]);
    d.sessions += 1; d.minutes += state.prefs.focus;
    state.days[today] = d;
    Promise.resolve(persist.saveDay(today, d)).catch(fail);
    var t = timer.taskId && find(timer.taskId);
    if (t) commit(Object.assign({}, t, { spent: (t.spent || 0) + 1 }));
  }
  function advance(completed) {
    var prev = timer.phase;
    if (prev === 'focus') {
      timer.phase = timer.round >= state.prefs.every ? 'long' : 'short';
    } else {
      timer.phase = 'focus';
      timer.round = prev === 'long' ? 1 : Math.min(state.prefs.every, timer.round + 1);
    }
    timer.status = 'idle'; timer.remaining = phaseMs(timer.phase);
    saveTimer(); wakeOff();
    if (completed) {
      beep();
      var mins = Math.round(phaseMs(timer.phase) / 60000);
      toast(prev === 'focus' ? 'Focus session done. Time for a ' + mins + ' minute break.' : 'Break over. Ready for ' + mins + ' minutes of focus.');
    }
    render();
    if (completed && state.prefs.auto) timerStart();
  }
  function timerFinish() {
    if (timer.phase === 'focus') recordSession();
    advance(true);
  }
  function tick() {
    if (timer.status !== 'running') return;
    var rem = timer.endsAt - Date.now();
    if (rem <= 0) {
      if (!state.loaded || !state.daysLoaded) { paintTimer(0); return; }
      timerFinish();
      return;
    }
    paintTimer(rem);
  }
  function mmss(ms) {
    var s = Math.ceil(ms / 1000);
    return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function paintTimer(rem) {
    if (rem === undefined) rem = curRemaining();
    var total = phaseMs(timer.phase);
    $('tmTime').textContent = mmss(rem);
    $('tmRing').style.strokeDashoffset = String(CIRC * (1 - (total ? rem / total : 0)));
    renderTabTime(rem);
  }
  function renderTabTime(rem) {
    var el = $('tabTime');
    if (timer.status === 'idle' || state.view === 'focus') { el.textContent = ''; return; }
    if (rem === undefined) rem = curRemaining();
    el.textContent = mmss(rem);
  }
  var taskOptKey = '';
  function renderFocus() {
    var brk = timer.phase !== 'focus';
    $('tmCard').classList.toggle('brk', brk);
    $('tmPhase').textContent = timer.phase === 'focus' ? 'Focus' : timer.phase === 'short' ? 'Short break' : 'Long break';
    $('tmSub').textContent = timer.status === 'running' ? 'running' : timer.status === 'paused' ? 'paused' : 'ready';
    $('tmStart').textContent = timer.status === 'running' ? 'Pause' : timer.status === 'paused' ? 'Resume' : 'Start';

    var rounds = $('tmRounds');
    rounds.replaceChildren();
    var filled = brk ? timer.round : timer.round - 1;
    for (var i = 0; i < state.prefs.every; i++) rounds.append(h('i', { class: 'rd' + (i < filled ? ' on' : '') }));
    rounds.setAttribute('aria-label', filled + ' of ' + state.prefs.every + ' sessions done in this cycle');

    var open = state.tasks.filter(function (t) { return !t.done; }).sort(byOrder);
    var cur = timer.taskId && find(timer.taskId);
    if (cur && cur.done) cur = null;
    if (!cur && timer.taskId) { timer.taskId = ''; saveTimer(); }
    var key = open.map(function (t) { return t.id + t.title; }).join('|') + '#' + timer.taskId;
    if (key !== taskOptKey) {
      taskOptKey = key;
      var sel = $('tmTask');
      sel.replaceChildren(h('option', { value: '', text: 'No task' }));
      open.forEach(function (t) { sel.append(h('option', { value: t.id, text: t.title, selected: t.id === timer.taskId })); });
      sel.value = timer.taskId;
    }
    var subs = $('tmSubs');
    subs.replaceChildren();
    if (cur) {
      state.open[cur.id] = state.open[cur.id] || false;
      subs.append(h('h3', { text: 'Subtasks for this task' }), subPanel(cur));
    }
    $('tmPlan').replaceChildren(planCard(todayISO()));

    var p = state.prefs, map = { pfFocus: p.focus, pfShort: p.short, pfLong: p.long, pfEvery: p.every, pfGoal: p.goal };
    Object.keys(map).forEach(function (id) { var el = $(id); if (document.activeElement !== el) el.value = String(map[id]); });
    $('pfAuto').checked = p.auto;
    paintTimer();
  }

  /* ---------- view routing ---------- */
  function viewFromHash() {
    var v = (location.hash || '').replace('#', '');
    return VIEWS.indexOf(v) >= 0 ? v : 'list';
  }
  function setView(v) {
    if (location.hash === '#' + v) { state.view = v; render(); }
    else location.hash = v;
  }

  function renderFoot() {
    var f = $('foot');
    f.replaceChildren();
    if (state.mode === 'db') f.append(h('span', { text: 'Saved to your account. Only you can see these tasks.' }));
    else if (state.mode === 'local') f.append(h('span', { text: 'Saved in this browser only.' }));
    if (state.tasks.some(function (t) { return t.example; })) {
      f.append(h('button', { type: 'button', class: 'linkbtn', text: 'Remove example tasks', onclick: removeExamples }));
    }
  }
  function render() {
    $('viewList').hidden = state.view !== 'list';
    $('viewCal').hidden = state.view !== 'calendar';
    $('viewFocus').hidden = state.view !== 'focus';
    renderHeader(); renderTabs(); renderCats();
    if (state.view === 'list') { renderFilters(); renderList(); }
    else if (state.view === 'calendar') renderCal();
    else renderFocus();
    renderTabTime();
    renderFoot();
  }
  function setToday() {
    $('today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  /* ---------- storage ---------- */
  function readLS(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function writeLS(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function useLocal() {
    state.mode = 'local';
    var data = readLS(LS_TASKS, []);
    state.tasks = (Array.isArray(data) ? data : []).filter(function (o) { return o && o.id; }).map(function (o) { return norm(o); });
    var days = readLS(LS_DAYS, {}), out = {};
    Object.keys(days || {}).forEach(function (k) { out[k] = normDay(days[k]); });
    state.days = out;
    state.prefs = normPrefs(readLS(LS_PREFS, null));
    persist = {
      save: function () { writeLS(LS_TASKS, state.tasks); },
      remove: function () { writeLS(LS_TASKS, state.tasks); },
      saveDay: function () { writeLS(LS_DAYS, state.days); },
      savePrefs: function (p) { writeLS(LS_PREFS, p); }
    };
    state.loaded = true; state.daysLoaded = true;
    applyPrefs();
    render();
  }
  function showNote(msg) { var n = $('status'); n.textContent = msg; n.hidden = false; }
  function hideNote() { $('status').hidden = true; }

  async function init() {
    var ok = false;
    try {
      if (window.claude && window.claude.use) {
        var res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        var db = res[0], user = res[1];
        var uid = user ? await user.id() : null;
        if (db && uid) {
          var col = db.collection('data/users/' + uid);
          var app = db.doc('data/users/' + uid + '/app');
          var daysCol = app.collection('days');
          var prefDoc = app.collection('prefs').doc('timer');
          persist = {
            save: function (t) { return col.doc(t.id).set(taskDoc(t)); },
            remove: function (id) { return col.doc(id).delete(); },
            saveDay: function (date, d) { return daysCol.doc(date).set({ goal: d.goal, sessions: d.sessions, minutes: d.minutes }); },
            savePrefs: function (p) { return prefDoc.set(p); }
          };
          state.mode = 'db';
          ok = true;
          var timerT = setTimeout(function () {
            showNote('Your saved tasks cannot be reached yet. What you see may be out of date.');
            state.loaded = true; state.daysLoaded = true;
            render();
          }, 10000);
          col.onSnapshot(function (snap) {
            if (snap.metadata.fromCache && snap.empty) return;
            if (!snap.metadata.fromCache) { clearTimeout(timerT); hideNote(); }
            state.tasks = snap.docs.filter(function (d) { var v = d.data(); return v && typeof v.title === 'string'; })
              .map(function (d) { return norm(d.data(), d.id); });
            state.loaded = true;
            render();
          }, function () {
            clearTimeout(timerT);
            if (!state.loaded) { useLocal(); showNote('Your account storage is unavailable, so tasks are kept in this browser for now.'); }
            else showNote('Saving to your account stopped working. Reload the page to try again.');
          });
          daysCol.onSnapshot(function (snap) {
            if (snap.metadata.fromCache && snap.empty) return;
            var o = {};
            snap.docs.forEach(function (d) { o[d.id] = normDay(d.data()); });
            state.days = o;
            state.daysLoaded = true;
            render();
          }, function () {});
          prefDoc.onSnapshot(function (snap) {
            if (snap.exists) state.prefs = normPrefs(snap.data());
            applyPrefs();
            render();
          }, function () {});
        }
      }
    } catch (e) { ok = false; }
    if (!ok) useLocal();
  }

  /* ---------- wiring ---------- */
  $('add').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('newTitle').value.trim();
    if (!title) return;
    var t = norm({ title: title, cat: $('newCat').value.trim(), pri: $('newPri').value, due: $('newDue').value, est: $('newEst').value, done: false, created: Date.now() }, newId());
    $('newTitle').value = ''; $('newDue').value = ''; $('newEst').value = '';
    if (state.status === 'done') state.status = 'open';
    commit(t);
    $('newTitle').focus();
  });
  $('dayAdd').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('dayNew').value.trim();
    if (!title) return;
    $('dayNew').value = '';
    commit(norm({ title: title, due: state.sel, pri: 2, created: Date.now() }, newId()));
    $('dayNew').focus();
  });
  document.querySelectorAll('.filters .seg button').forEach(function (b) {
    b.addEventListener('click', function () { state.status = b.getAttribute('data-status'); render(); });
  });
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; renderList(); });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; render(); });
  $('calPrev').addEventListener('click', function () { var c = state.cal; state.cal = c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 }; renderCal(); });
  $('calNext').addEventListener('click', function () { var c = state.cal; state.cal = c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 }; renderCal(); });
  $('calToday').addEventListener('click', function () { var n = new Date(); state.cal = { y: n.getFullYear(), m: n.getMonth() }; state.sel = todayISO(); renderCal(); });
  $('tmStart').addEventListener('click', function () { if (timer.status === 'running') timerPause(); else timerStart(); });
  $('tmReset').addEventListener('click', timerReset);
  $('tmSkip').addEventListener('click', function () { advance(false); });
  $('tmTask').addEventListener('change', function (e) { timer.taskId = e.target.value; saveTimer(); taskOptKey = ''; renderFocus(); });
  ['pfFocus', 'pfShort', 'pfLong', 'pfEvery', 'pfGoal', 'pfAuto'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      var p = normPrefs({
        focus: $('pfFocus').value, short: $('pfShort').value, long: $('pfLong').value,
        every: $('pfEvery').value, goal: $('pfGoal').value, auto: $('pfAuto').checked
      });
      state.prefs = p;
      applyPrefs();
      saveTimer();
      Promise.resolve(persist.savePrefs(p)).catch(fail);
      render();
    });
  });
  window.addEventListener('hashchange', function () { state.view = viewFromHash(); render(); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { setToday(); if (timer.status === 'running') wakeOn(); render(); }
  });
  setInterval(tick, 250);

  state.view = viewFromHash();
  loadTimer();
  setToday();
  render();
  init().then(function () { loadTimer(); applyPrefs(); render(); });
})();
</script>

</body>
</html>
